name: Feature request
description: Suggest an idea or improvement
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Describe the problem you’re solving. Links to docs or prior discussion welcome.

  - type: textarea
    id: problem
    attributes:
      label: Problem or use case
      description: What’s missing or painful today?
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: How you’d like it to work (API, UX, config, docs).
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other approaches you’ve thought about, or workarounds you use now.
    validations:
      required: false

  - type: markdown
    attributes:
      value: "### Context (optional)"

  - type: textarea
    id: env_context
    attributes:
      label: Environment / constraints
      description: Anything that affects the feature (e.g. self-hosted only, Meta API limits, no Docker). **No secrets.**

  - type: checkboxes
    id: willing
    attributes:
      label: Contribution
      options:
        - label: I’m willing to open a PR for this (or help test)
